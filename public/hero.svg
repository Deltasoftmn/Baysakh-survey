<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091945"/>
      <stop offset="0.55" stop-color="#10378C"/>
      <stop offset="1" stop-color="#0B1F55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(470 270) rotate(35) scale(820 520)">
      <stop stop-color="#F57E20" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F57E20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- grid -->
  <g opacity="0.18">
    <path d="M0 220H1920" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <path d="M0 440H1920" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <path d="M0 660H1920" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <path d="M0 880H1920" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <path d="M260 0V1080" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <path d="M520 0V1080" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <path d="M780 0V1080" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M1040 0V1080" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <path d="M1300 0V1080" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <path d="M1560 0V1080" stroke="#FFFFFF" stroke-opacity="0.05"/>
  </g>

  <!-- infrastructure silhouettes -->
  <g opacity="0.92">
    <path d="M0 880C220 790 380 820 560 760C760 692 880 720 1080 650C1320 566 1500 590 1720 520C1820 486 1900 460 1920 450V1080H0V880Z" fill="#07153D"/>
    <path d="M0 905C230 820 390 850 560 790C760 720 880 752 1080 690C1320 610 1500 630 1720 566C1820 534 1900 510 1920 500V1080H0V905Z" fill="#061134"/>
  </g>

  <!-- rails / road lines -->
  <g opacity="0.35">
    <path d="M110 1030C380 880 640 860 950 780C1280 694 1490 680 1840 560" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M160 1080C430 920 690 900 995 820C1320 734 1530 720 1885 600" stroke="#F57E20" stroke-opacity="0.38" stroke-width="2"/>
  </g>

  <!-- survey instrument abstract -->
  <g transform="translate(1380 250)" opacity="0.78">
    <circle cx="190" cy="180" r="170" fill="url(#steel)"/>
    <g filter="url(#soft)" opacity="0.65">
      <circle cx="190" cy="180" r="112" fill="#0B1F55"/>
    </g>
    <path d="M140 160h100v54c0 12-10 22-22 22h-56c-12 0-22-10-22-22v-54Z" fill="#FFFFFF" fill-opacity="0.88"/>
    <path d="M166 170h48a8 8 0 0 1 8 8v12a8 8 0 0 1-8 8h-48a8 8 0 0 1-8-8v-12a8 8 0 0 1 8-8Z" fill="#F57E20"/>
    <path d="M182 236l-48 120h18l30-70 30 70h18l-48-120h-18Z" fill="#FFFFFF" fill-opacity="0.75"/>
  </g>
</svg>

